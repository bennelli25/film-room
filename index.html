(async () => {
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const salt = bytes(V.s), iv = bytes(V.i), data = bytes(V.c), KEY = 'ffr.gate';
  const form = document.getElementById('gate'), msg = document.getElementById('msg'), go = document.getElementById('go'), code = document.getElementById('code');
  const open = async raw => {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data));
  };
  /* Replace this lock page with the app. Wait until the lock page has finished loading first,
     otherwise the browser would append the app to it instead of replacing it. */
  const show = async html => {
    if (document.readyState === 'loading') await new Promise(r => document.addEventListener('DOMContentLoaded', r, { once: true }));
    document.open(); document.write(html); document.close();
  };
  if (!window.crypto || !crypto.subtle) { form.hidden = false; code.disabled = go.disabled = true; msg.textContent = 'This browser cannot unlock the page. Open the link in Chrome or Safari.'; return; }
  /* a device that has unlocked before keeps the key, so the passcode is typed once */
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { saved = null; }
  if (saved) {
    try { await show(await open(bytes(saved))); return; }
    catch (e) { try { localStorage.removeItem(KEY); } catch (e2) { /* storage is optional */ } }
  }
  form.hidden = false;
  code.focus();
  form.addEventListener('submit', async e => {
    e.preventDefault();
    msg.textContent = ''; go.disabled = true; go.textContent = 'Unlocking\u2026';
    try {
      const pass = code.value.trim().toLowerCase().replace(/\s+/g, '-');
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
      const raw = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: V.n, hash: 'SHA-256' }, base, 256));
      const html = await open(raw);
      try { localStorage.setItem(KEY, btoa(String.fromCharCode.apply(null, raw))); } catch (e2) { /* storage is optional */ }
      await show(html);
    } catch (err) {
      msg.textContent = 'That passcode did not work. Check it and try again.';
      go.disabled = false; go.textContent = 'Unlock';
    }
  });
})();
